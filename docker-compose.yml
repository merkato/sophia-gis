# Sophia — pełny stos: PostGIS + QGIS Server + API + WebUI + proxy SSL (Caddy)
# Uruchomienie:  cp .env.example .env  &&  docker compose up -d --build

name: sophia

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    # Port wystawiony tylko na localhost — do podłączenia QGIS Desktop przez tunel / lokalnie.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  qgis:
    image: ${QGIS_SERVER_IMAGE:-camptocamp/qgis-server:4.2}
    restart: unless-stopped
    # start ze strojeniem pod CPU i pamięć kontenera (procesy, wątki renderu) — config/qgis-start.sh
    command: ["/usr/local/bin/sophia-start"]
    environment:
      PGSERVICEFILE: /etc/sophia/pg_service.conf
      QGIS_SERVER_LOG_LEVEL: 1
      QGIS_SERVER_PARALLEL_RENDERING: "true"
      QGIS_SERVER_IGNORE_BAD_LAYERS: "true"
      QGIS_SERVER_TRUST_LAYER_METADATA: "true"
      QGIS_PLUGINPATH: /var/www/plugins
      MAX_CACHE_LAYERS: 500
      # nadpisanie strojenia (puste = wyliczone przy starcie z CPU i pamięci kontenera)
      SOPHIA_QGIS_PROCESSES: ${SOPHIA_QGIS_PROCESSES:-}
      SOPHIA_QGIS_MIN_PROCESSES: ${SOPHIA_QGIS_MIN_PROCESSES:-}
      SOPHIA_QGIS_THREADS: ${SOPHIA_QGIS_THREADS:-}
      SOPHIA_QGIS_PROCESS_MB: ${SOPHIA_QGIS_PROCESS_MB:-}
    volumes:
      - ./data/projects:/projects:ro
      - ./data/rasters:/rasters:ro
      - ./config/pg_service.conf:/etc/sophia/pg_service.conf:ro
      - ./qgis-server-plugins:/var/www/plugins:ro
      - ./config/qgis-start.sh:/usr/local/bin/sophia-start:ro
    depends_on:
      db:
        condition: service_healthy
    # BRAK portów publicznych — dostęp wyłącznie przez proxy z autoryzacją w API.

  # Cache kafli rastrów (proxy/tilecache.conf): Caddy -> tilecache -> qgis
  tilecache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./proxy/tilecache.conf:/etc/nginx/conf.d/default.conf:ro
      - tiles:/var/cache/tiles
    depends_on: [qgis]

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      PGSERVICEFILE: /etc/sophia/pg_service.conf
      PROJECTS_DIR: /projects
      UPLOADS_DIR: /uploads
      QGIS_SERVER_URL: http://qgis:80/
    volumes:
      - ./data/projects:/projects        # rw: publikacja projektów z wtyczki QGIS
      - ./data/rasters:/rasters          # rw: wysyłka rastrów biblioteki z Fii (qgis: ro)
      - ./data/uploads:/uploads          # zdjęcia z WebUI: data/uploads/<slug>/zdjecia/...
      - ./config/pg_service.conf:/etc/sophia/pg_service.conf:ro
      - ./plugins:/plugins:ro            # wtyczki (scripts/server/plugin.sh, docs/WTYCZKI.md)
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped

  # Lekki Postfix tylko do wysyłki powiadomień (app/mail.py) — bez portów publicznych; podpis DKIM (klucz
  # generowany przy pierwszym starcie w data/mail-dkim). Włączenie: COMPOSE_PROFILES=mail w .env (docs/SERVER.md).
  mail:
    image: boky/postfix:v5.2.1-alpine
    restart: unless-stopped
    profiles: ["mail"]
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-}
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-}
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-sophia}
      INBOUND_DEBUGGING: "0"
    volumes:
      - ./data/mail-dkim:/var/lib/rspamd/dkim      # klucz DKIM (backend rspamd) — trwały; DNS: data/mail-dkim/*.txt

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/sites:/etc/caddy/sites:ro     # inne serwisy na tym VPS (proxy/sites/README.md)
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"   # usługi uruchomione bezpośrednio na hoście
    networks: [default, edge]
    depends_on: [api, web, tilecache]

networks:
  # Wspólna sieć dla innych projektów Compose na tym serwerze (dołączają jako external: true)
  edge:
    name: edge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  tiles:
