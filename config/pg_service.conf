# Wspólna definicja połączenia dla QGIS Desktop, QGIS Server i API.
# Projekty QGIS MUSZĄ łączyć się przez "service=sophia" (nie host/port/hasło),
# dzięki temu ten sam plik .qgz działa na desktopie i w kontenerze.
#
# Na desktopie skopiuj ten plik, zmień host na adres serwera (lub localhost przy
# tunelu SSH) i ustaw zmienną środowiskową PGSERVICEFILE albo umieść go jako
# %APPDATA%\postgresql\.pg_service.conf (Windows) / ~/.pg_service.conf (Linux).
#
# UWAGA: hasło musi być zgodne z POSTGRES_PASSWORD w .env.

[sophia]
host=db
port=5432
dbname=sophia
user=sophia
password=zmien-mnie
sslmode=disable
