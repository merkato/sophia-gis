# Cache kafli rastrów między Caddy a QGIS Server.
#
#   przeglądarka -> Caddy (autoryzacja forward_auth) -> tilecache (ten nginx) -> QGIS Server
#
# Cache'owane są wyłącznie żądania z TILED=true (kafle rastrów z WebUI na stałej siatce).
# Wektory, GetFeatureInfo, GetLegendGraphic itd. przechodzą bez cache.
# Klucz = pełny URI po przepisaniu przez Caddy: zawiera MAP (ścieżkę projektu), LAYERS, BBOX
# i V (wersję projektu), więc ponowna publikacja projektu automatycznie daje nowe kafle.
# Autoryzacja odbywa się w Caddy PRZED cache — każdy kafel jest sprawdzany dla użytkownika.
#
# Po podmianie samych plików rastrowych (bez ponownej publikacji) zmień wersję projektu:
#   touch data/projects/<slug>/<slug>.qgz
# albo wyczyść cały cache:
#   docker compose exec tilecache sh -c 'rm -rf /var/cache/tiles/*'

proxy_cache_path /var/cache/tiles levels=1:2 keys_zone=tiles:32m max_size=5g inactive=90d
                 use_temp_path=off;

map $args $skip_cache {
    "~(^|&)TILED=true(&|$)"  0;
    default                  1;
}

# Przeglądarka: kafel z wersją projektu w adresie można trzymać długo ("private": wymaga logowania)
map $skip_cache $browser_cache {
    0        "private, max-age=604800";
    default  "";
}

server {
    listen 80;
    server_tokens off;

    location / {
        proxy_pass http://qgis:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;

        proxy_cache tiles;
        proxy_cache_key $request_uri;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_valid 200 90d;
        proxy_cache_lock on;                 # ten sam kafel renderowany tylko raz naraz
        proxy_cache_lock_timeout 120s;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Cache-Control;

        add_header Cache-Control $browser_cache always;
        add_header X-Tile-Cache $upstream_cache_status always;
    }
}
